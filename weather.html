<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Weather Center - UPT PUSDA</title>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
        /* ============================================================
           WEATHER CENTER - TEMA UPT PUSDA
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0d1b3e;
            --bg-card: rgba(15, 32, 77, 0.85);
            --border: rgba(255, 255, 255, 0.12);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --toska: #2dd4bf;
            --text: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.6);
            --radius: 16px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at top right, #1e40af, #0d1b3e 85%);
            color: var(--text);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .weather-container {
            max-width: 720px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Header */
        .weather-header {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .weather-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .weather-title {
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }
        .weather-title i { color: var(--toska); }

        .location-selector {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .location-selector select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            min-height: 36px;
        }
        .location-selector select option { background: #0d1b3e; }

        .refresh-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, var(--info), #1e40af);
            color: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            min-height: 36px;
        }
        .refresh-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }

        .last-updated {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Tabs */
        .weather-tabs {
            display: flex;
            gap: 6px;
            background: rgba(0,0,0,0.25);
            padding: 6px;
            border-radius: 10px;
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .weather-tab {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.7rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            min-height: 36px;
        }
        .weather-tab i { font-size: 14px; }
        .weather-tab.active {
            background: var(--info);
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }
        .weather-tab:hover:not(.active) {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease-out;
        }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Current Weather */
        .current-weather {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
        }

        .current-main {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .current-icon {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
        }

        .current-info {
            flex: 1;
            min-width: 140px;
        }
        .current-temp {
            font-size: 3rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
            margin-bottom: 4px;
        }
        .current-desc {
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: capitalize;
            margin-bottom: 4px;
        }
        .current-feels {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .current-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .detail-item {
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }
        .detail-icon {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        .detail-label {
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Hourly */
        .hourly-forecast, .daily-forecast, .weather-alerts, .suggestions-panel {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 16px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        .section-title i { color: var(--toska); }

        .hourly-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .hourly-scroll::-webkit-scrollbar { height: 4px; }
        .hourly-scroll::-webkit-scrollbar-thumb { background: var(--info); border-radius: 4px; }

        .hourly-item {
            min-width: 70px;
            padding: 12px 8px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            text-align: center;
            transition: 0.2s;
            cursor: default;
        }
        .hourly-item.now {
            background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(45,212,191,0.2));
            border: 1px solid var(--info);
        }
        .hourly-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .hourly-icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 4px;
        }
        .hourly-temp {
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }
        .hourly-rain {
            font-size: 0.6rem;
            color: var(--info);
            margin-top: 2px;
        }

        /* Daily */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .daily-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            transition: 0.2s;
        }
        .daily-item:hover { background: rgba(59,130,246,0.15); transform: translateX(4px); }
        .daily-day {
            min-width: 80px;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .daily-date {
            font-size: 0.65rem;
            color: var(--text-muted);
        }
        .daily-icon {
            width: 32px;
            height: 32px;
        }
        .daily-desc {
            flex: 1;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: capitalize;
        }
        .daily-temps {
            display: flex;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .temp-max { color: var(--warning); font-weight: 700; }
        .temp-min { color: var(--info); opacity: 0.7; }
        .daily-rain {
            font-size: 0.7rem;
            color: var(--info);
            min-width: 50px;
            text-align: right;
        }

        /* Alerts */
        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid;
            background: rgba(0,0,0,0.2);
        }
        .alert-item.danger { border-color: var(--danger); }
        .alert-item.warning { border-color: var(--warning); }
        .alert-item.info { border-color: var(--info); }
        .alert-icon { font-size: 1.4rem; flex-shrink: 0; }
        .alert-title { font-weight: 700; font-size: 0.85rem; }
        .alert-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }

        .no-alerts {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
        .no-alerts-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.5; }

        /* Suggestions */
        .suggestion-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            margin-bottom: 8px;
        }
        .suggestion-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .suggestion-icon.outdoor { background: rgba(16,185,129,0.2); }
        .suggestion-icon.indoor { background: rgba(59,130,246,0.2); }
        .suggestion-icon.caution { background: rgba(245,158,11,0.2); }
        .suggestion-icon.danger { background: rgba(239,68,68,0.2); }

        .suggestion-content { flex: 1; }
        .suggestion-title { font-weight: 700; font-size: 0.85rem; }
        .suggestion-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.4; }

        /* Loading & Error */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 12px;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59,130,246,0.2);
            border-top-color: var(--info);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-container {
            text-align: center;
            padding: 40px;
        }
        .error-icon { font-size: 3rem; margin-bottom: 12px; }
        .error-message { font-size: 1rem; margin-bottom: 16px; }
        .retry-btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            background: var(--info);
            color: white;
            cursor: pointer;
            font-weight: 700;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .weather-container { gap: 10px; }

            .weather-header { padding: 12px 14px; }
            .weather-title { font-size: 0.95rem; }

            .current-main { gap: 12px; }
            .current-temp { font-size: 2.4rem; }
            .current-icon { width: 64px; height: 64px; }

            .current-details { grid-template-columns: repeat(2, 1fr); gap: 8px; }

            .hourly-item { min-width: 60px; padding: 8px 6px; }
            .daily-day { min-width: 60px; font-size: 0.7rem; }
            .daily-temps { font-size: 0.7rem; }

            .weather-tab { font-size: 0.65rem; padding: 6px 10px; }
            .weather-tab i { font-size: 12px; }

            .location-selector select { font-size: 0.7rem; padding: 4px 8px; }
            .refresh-btn { font-size: 0.65rem; padding: 4px 10px; }
        }

        @media (max-width: 400px) {
            .current-details { grid-template-columns: 1fr 1fr; }
            .daily-item { flex-wrap: wrap; gap: 6px; }
            .daily-day { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <!-- Header -->
        <div class="weather-header">
            <div class="weather-header-top">
                <div class="weather-title">
                    <i data-lucide="cloud-sun" size="18"></i>
                    Weather Center
                </div>
                <div class="location-selector">
                    <select id="locationSelect" onchange="changeLocation()">
                        <option value="-8.4338918,114.2217959">Kantor UPT PUSDA</option>
                        <option value="-7.25,112.75">Surabaya</option>
                        <option value="-7.30,112.73">Sidoarjo</option>
                        <option value="-7.20,112.78">Gresik</option>
                    </select>
                    <button class="refresh-btn" onclick="refreshWeather()">
                        <i data-lucide="refresh-cw" size="14"></i>
                    </button>
                </div>
            </div>
            <div class="last-updated" id="lastUpdated">Terakhir diperbarui: --</div>
        </div>

        <!-- Tabs -->
        <div class="weather-tabs" id="weatherTabs">
            <button class="weather-tab active" data-tab="current">
                <i data-lucide="sun" size="14"></i> Saat Ini
            </button>
            <button class="weather-tab" data-tab="hourly">
                <i data-lucide="clock" size="14"></i> Per Jam
            </button>
            <button class="weather-tab" data-tab="daily">
                <i data-lucide="calendar" size="14"></i> 7 Hari
            </button>
            <button class="weather-tab" data-tab="alerts">
                <i data-lucide="alert-triangle" size="14"></i> Alert
            </button>
            <button class="weather-tab" data-tab="suggestions">
                <i data-lucide="lightbulb" size="14"></i> Saran
            </button>
        </div>

        <!-- Loading -->
        <div class="loading-container" id="loadingContainer">
            <div class="loading-spinner"></div>
            <span>Memuat data cuaca...</span>
        </div>

        <!-- Error -->
        <div class="error-container" id="errorContainer" style="display:none;">
            <div class="error-icon">⚠️</div>
            <div class="error-message" id="errorMessage">Gagal memuat data</div>
            <button class="retry-btn" onclick="refreshWeather()">🔄 Coba Lagi</button>
        </div>

        <!-- Tab: Current -->
        <div class="tab-content active" id="tab-current">
            <div class="current-weather">
                <div class="current-main">
                    <img id="currentIcon" class="current-icon" src="" alt="Weather">
                    <div class="current-info">
                        <div class="current-temp" id="currentTemp">--°C</div>
                        <div class="current-desc" id="currentDesc">Memuat...</div>
                        <div class="current-feels" id="currentFeels">Terasa seperti --°C</div>
                    </div>
                </div>
                <div class="current-details">
                    <div class="detail-item">
                        <div class="detail-icon">💧</div>
                        <div class="detail-value" id="humidity">--%</div>
                        <div class="detail-label">Kelembaban</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">💨</div>
                        <div class="detail-value" id="wind">-- km/h</div>
                        <div class="detail-label">Angin</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌡️</div>
                        <div class="detail-value" id="pressure">-- hPa</div>
                        <div class="detail-label">Tekanan</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">👁️</div>
                        <div class="detail-value" id="visibility">-- km</div>
                        <div class="detail-label">Jarak Pandang</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌅</div>
                        <div class="detail-value" id="sunrise">--:--</div>
                        <div class="detail-label">Terbit</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-icon">🌇</div>
                        <div class="detail-value" id="sunset">--:--</div>
                        <div class="detail-label">Terbenam</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab: Hourly -->
        <div class="tab-content" id="tab-hourly">
            <div class="hourly-forecast">
                <div class="section-title">
                    <i data-lucide="clock" size="18"></i> Prakiraan Per Jam (24 Jam)
                </div>
                <div class="hourly-scroll" id="hourlyScroll"></div>
            </div>
        </div>

        <!-- Tab: Daily -->
        <div class="tab-content" id="tab-daily">
            <div class="daily-forecast">
                <div class="section-title">
                    <i data-lucide="calendar" size="18"></i> 7 Hari ke Depan
                </div>
                <div class="daily-list" id="dailyList"></div>
            </div>
        </div>

        <!-- Tab: Alerts -->
        <div class="tab-content" id="tab-alerts">
            <div class="weather-alerts">
                <div class="section-title">
                    <i data-lucide="alert-triangle" size="18"></i> Peringatan Cuaca
                </div>
                <div id="alertsList"></div>
            </div>
        </div>

        <!-- Tab: Suggestions -->
        <div class="tab-content" id="tab-suggestions">
            <div class="suggestions-panel">
                <div class="section-title">
                    <i data-lucide="lightbulb" size="18"></i> Saran Kegiatan
                </div>
                <div id="suggestionsList"></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // WEATHER CENTER LOGIC (dengan Lucide)
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            // Tab switching
            document.querySelectorAll('.weather-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.weather-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    const tabName = this.dataset.tab;
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    document.getElementById('tab-' + tabName).classList.add('active');
                });
            });
            // Load data
            loadWeatherData();
        });

        // === Konfigurasi ===
        const API_KEY = 'a427dbab5ea52ac024503493f94aaf36'; // Ganti dengan API key Anda
        const CACHE_DURATION = 30 * 60 * 1000;

        let currentLocation = { lat: -8.4338918, lng: 114.2217959, name: 'Kantor UPT PUSDA' };
        let weatherData = null;

        // === Fungsi utama ===
        function changeLocation() {
            const select = document.getElementById('locationSelect');
            const [lat, lng] = select.value.split(',').map(Number);
            const name = select.options[select.selectedIndex].text;
            currentLocation = { lat, lng, name };
            loadWeatherData();
        }

        function refreshWeather() {
            localStorage.removeItem('weather_cache_' + currentLocation.lat);
            loadWeatherData();
        }

        async function loadWeatherData() {
            showLoading();
            const cached = localStorage.getItem('weather_cache_' + currentLocation.lat);
            if (cached) {
                const { data, timestamp } = JSON.parse(cached);
                if (Date.now() - timestamp < CACHE_DURATION) {
                    weatherData = data;
                    renderAll();
                    return;
                }
            }
            try {
                const currentRes = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${currentLocation.lat}&lon=${currentLocation.lng}&appid=${API_KEY}&units=metric&lang=id`
                );
                if (!currentRes.ok) throw new Error('API error');
                const currentData = await currentRes.json();

                const forecastRes = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${currentLocation.lat}&lon=${currentLocation.lng}&appid=${API_KEY}&units=metric&lang=id`
                );
                if (!forecastRes.ok) throw new Error('Forecast error');
                const forecastData = await forecastRes.json();

                weatherData = { current: currentData, forecast: forecastData, timestamp: Date.now() };
                localStorage.setItem('weather_cache_' + currentLocation.lat, JSON.stringify({
                    data: weatherData,
                    timestamp: Date.now()
                }));
                renderAll();
            } catch (err) {
                console.error('Weather fetch error:', err);
                showError('Gagal memuat data cuaca. Periksa koneksi.');
            }
        }

        // === Render semua ===
        function renderAll() {
            hideLoading();
            renderCurrentWeather();
            renderHourlyForecast();
            renderDailyForecast();
            renderAlerts();
            renderSuggestions();
            updateLastUpdated();
            lucide.createIcons(); // refresh icons
        }

        function renderCurrentWeather() {
            const d = weatherData.current;
            document.getElementById('currentIcon').src = `https://openweathermap.org/img/wn/${d.weather[0].icon}@4x.png`;
            document.getElementById('currentTemp').textContent = Math.round(d.main.temp) + '°C';
            document.getElementById('currentDesc').textContent = d.weather[0].description;
            document.getElementById('currentFeels').textContent = `Terasa seperti ${Math.round(d.main.feels_like)}°C`;
            document.getElementById('humidity').textContent = d.main.humidity + '%';
            document.getElementById('wind').textContent = (d.wind.speed * 3.6).toFixed(1) + ' km/h';
            document.getElementById('pressure').textContent = d.main.pressure + ' hPa';
            document.getElementById('visibility').textContent = (d.visibility / 1000).toFixed(1) + ' km';
            document.getElementById('sunrise').textContent = formatTime(d.sys.sunrise);
            document.getElementById('sunset').textContent = formatTime(d.sys.sunset);
        }

        function renderHourlyForecast() {
            const container = document.getElementById('hourlyScroll');
            const items = weatherData.forecast.list.slice(0, 8);
            container.innerHTML = items.map((item, idx) => {
                const time = new Date(item.dt * 1000);
                const hour = time.getHours().toString().padStart(2,'0') + ':00';
                const isNow = idx === 0;
                const rain = Math.round((item.pop || 0) * 100);
                return `
                    <div class="hourly-item ${isNow ? 'now' : ''}">
                        <div class="hourly-time">${isNow ? 'Sekarang' : hour}</div>
                        <img class="hourly-icon" src="https://openweathermap.org/img/wn/${item.weather[0].icon}@2x.png" alt="">
                        <div class="hourly-temp">${Math.round(item.main.temp)}°</div>
                        ${rain > 0 ? `<div class="hourly-rain">💧 ${rain}%</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderDailyForecast() {
            const container = document.getElementById('dailyList');
            const dailyMap = {};
            weatherData.forecast.list.forEach(item => {
                const date = new Date(item.dt * 1000).toDateString();
                if (!dailyMap[date]) dailyMap[date] = { temps: [], icons: [], descs: [], rains: [] };
                dailyMap[date].temps.push(item.main.temp);
                dailyMap[date].icons.push(item.weather[0].icon);
                dailyMap[date].descs.push(item.weather[0].description);
                dailyMap[date].rains.push(item.pop || 0);
            });
            const days = Object.keys(dailyMap).slice(0, 7);
            container.innerHTML = days.map((date, idx) => {
                const data = dailyMap[date];
                const dateObj = new Date(date);
                const dayName = idx === 0 ? 'Hari Ini' : dateObj.toLocaleDateString('id-ID', { weekday: 'long' });
                const dateStr = dateObj.toLocaleDateString('id-ID', { day:'numeric', month:'short' });
                const maxT = Math.round(Math.max(...data.temps));
                const minT = Math.round(Math.min(...data.temps));
                const avgRain = Math.round(data.rains.reduce((a,b) => a+b, 0) / data.rains.length * 100);
                // most common icon
                const iconCount = {};
                data.icons.forEach(ic => iconCount[ic] = (iconCount[ic]||0)+1);
                const mainIcon = Object.keys(iconCount).sort((a,b) => iconCount[b]-iconCount[a])[0];
                const mainDesc = data.descs[0];
                return `
                    <div class="daily-item">
                        <div class="daily-day">
                            <div>${dayName}</div>
                            <div class="daily-date">${dateStr}</div>
                        </div>
                        <img class="daily-icon" src="https://openweathermap.org/img/wn/${mainIcon}@2x.png" alt="">
                        <div class="daily-desc">${mainDesc}</div>
                        <div class="daily-temps">
                            <span class="temp-max">${maxT}°</span>
                            <span class="temp-min">${minT}°</span>
                        </div>
                        ${avgRain > 0 ? `<div class="daily-rain">💧 ${avgRain}%</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function renderAlerts() {
            const container = document.getElementById('alertsList');
            const alerts = [];
            const d = weatherData.current;
            if (d.weather[0].main === 'Thunderstorm') {
                alerts.push({ type:'danger', icon:'⛈️', title:'Badai Petir', desc:'Hindari kegiatan outdoor dan cari tempat berlindung aman.' });
            }
            if (d.weather[0].main === 'Rain' && d.rain && d.rain['1h'] > 10) {
                alerts.push({ type:'danger', icon:'🌧️', title:'Hujan Deras', desc:`Curah hujan ${d.rain['1h'].toFixed(1)}mm/jam. Risiko banjir.` });
            }
            if (d.wind.speed > 10) {
                alerts.push({ type:'warning', icon:'💨', title:'Angin Kencang', desc:`Kecepatan ${(d.wind.speed*3.6).toFixed(0)} km/h. Hati-hati objek terbang.` });
            }
            if (d.main.temp > 35) {
                alerts.push({ type:'warning', icon:'🔥', title:'Suhu Panas', desc:`Suhu ${Math.round(d.main.temp)}°C. Pastikan hidrasi cukup.` });
            }
            if (d.visibility < 1000) {
                alerts.push({ type:'warning', icon:'🌫️', title:'Jarak Pandang Rendah', desc:`Jarak pandang ${(d.visibility/1000).toFixed(1)} km. Hati-hati berkendara.` });
            }
            // forecast rain in 3 hours
            const next = weatherData.forecast.list.slice(0,1);
            if (next.some(i => (i.pop||0) > 0.5) && d.weather[0].main !== 'Rain') {
                alerts.push({ type:'info', icon:'🌦️', title:'Hujan Akan Datang', desc:'Prakiraan hujan dalam 3 jam. Siapkan payung.' });
            }

            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="no-alerts">
                        <div class="no-alerts-icon">✅</div>
                        <div>Tidak ada peringatan cuaca</div>
                        <div style="font-size:0.75rem; opacity:0.7; margin-top:6px;">Kondisi aman</div>
                    </div>
                `;
            } else {
                container.innerHTML = alerts.map(a => `
                    <div class="alert-item ${a.type}">
                        <div class="alert-icon">${a.icon}</div>
                        <div>
                            <div class="alert-title">${a.title}</div>
                            <div class="alert-desc">${a.desc}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function renderSuggestions() {
            const container = document.getElementById('suggestionsList');
            const d = weatherData.current;
            const temp = d.main.temp, rain = d.weather[0].main === 'Rain', wind = d.wind.speed, humidity = d.main.humidity;
            const suggestions = [];

            if (!rain && temp >= 20 && temp <= 32 && wind < 8) {
                suggestions.push({ type:'outdoor', icon:'✅', title:'Kondisi Ideal Outdoor', desc:'Cuaca cerah, suhu nyaman. Waktu tepat untuk monitoring lapangan.' });
            }
            if (rain) {
                suggestions.push({ type:'indoor', icon:'🏢', title:'Prioritaskan Indoor', desc:'Hujan berlangsung. Tunda kegiatan lapangan jika memungkinkan.' });
            }
            if (temp > 32) {
                suggestions.push({ type:'caution', icon:'⏰', title:'Hindari Jam Terpanas', desc:'Suhu tinggi. Jadwalkan sebelum 10 pagi atau setelah 3 sore.' });
            }
            if (humidity > 80) {
                suggestions.push({ type:'caution', icon:'💧', title:'Kelembaban Tinggi', desc:'Risiko dehidrasi. Istirahat lebih sering dan minum cukup.' });
            }
            if (wind > 8) {
                suggestions.push({ type:'caution', icon:'💨', title:'Perhatikan Angin', desc:'Angin kencang. Amankan peralatan dan dokumen.' });
            }
            // besok
            const tomorrow = weatherData.forecast.list.filter(item => {
                const date = new Date(item.dt * 1000);
                const tomorrowDate = new Date(Date.now() + 24*60*60*1000);
                return date.toDateString() === tomorrowDate.toDateString();
            });
            if (tomorrow.some(i => (i.pop||0) > 0.5)) {
                suggestions.push({ type:'indoor', icon:'📅', title:'Persiapan Besok', desc:'Prakiraan hujan besok. Siapkan rencana alternatif.' });
            }
            // tip umum
            suggestions.push({ type:'outdoor', icon:'📱', title:'Tips Presensi Lapangan', desc:'Pastikan sinyal cukup, GPS akurat, dan foto dengan pencahayaan baik.' });

            container.innerHTML = suggestions.map(s => `
                <div class="suggestion-item">
                    <div class="suggestion-icon ${s.type}">${s.icon}</div>
                    <div class="suggestion-content">
                        <div class="suggestion-title">${s.title}</div>
                        <div class="suggestion-desc">${s.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        // === Helpers ===
        function formatTime(ts) {
            return new Date(ts*1000).toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
        }
        function updateLastUpdated() {
            document.getElementById('lastUpdated').textContent =
                'Terakhir diperbarui: ' + new Date().toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
        }

        function showLoading() {
            document.getElementById('loadingContainer').style.display = 'flex';
            document.getElementById('errorContainer').style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
        }
        function hideLoading() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = '');
        }
        function showError(msg) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'block';
            document.getElementById('errorMessage').textContent = msg;
        }
    </script>
</body>
</html>
