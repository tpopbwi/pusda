<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuaca - UPT PUSDA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0d1b3e, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .weather-container {
            text-align: center;
            max-width: 400px;
        }
        .weather-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }
        .weather-temp {
            font-size: 4rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 10px;
        }
        .weather-desc {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
            text-transform: capitalize;
        }
        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .weather-detail {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .weather-detail .label {
            font-size: 0.7rem;
            opacity: 0.6;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .weather-detail .value {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .weather-alert {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }
        .weather-alert.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="weather-container">
        <img id="weatherIcon" class="weather-icon" src="" alt="Weather">
        <div class="weather-temp" id="weatherTemp">--°C</div>
        <div class="weather-desc" id="weatherDesc">Loading...</div>
        
        <div class="weather-details">
            <div class="weather-detail">
                <div class="label">Kelembaban</div>
                <div class="value" id="humidity">--%</div>
            </div>
            <div class="weather-detail">
                <div class="label">Angin</div>
                <div class="value" id="wind">-- km/h</div>
            </div>
            <div class="weather-detail">
                <div class="label">Tekanan</div>
                <div class="value" id="pressure">-- hPa</div>
            </div>
            <div class="weather-detail">
                <div class="label">Visibility</div>
                <div class="value" id="visibility">-- km</div>
            </div>
        </div>
        
        <div class="weather-alert" id="weatherAlert">
            ⚠️ <span id="alertText"></span>
        </div>
    </div>

    <script>
        const API_KEY = 'YOUR_OPENWEATHERMAP_API_KEY';
        const LAT = -7.2574719;
        const LON = 112.7520883;
        
        async function fetchWeather() {
            try {
                const res = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${LAT}&lon=${LON}&appid=${API_KEY}&units=metric&lang=id`
                );
                const data = await res.json();
                updateUI(data);
            } catch (error) {
                document.getElementById('weatherDesc').textContent = 'Gagal memuat cuaca';
            }
        }
        
        function updateUI(data) {
            document.getElementById('weatherIcon').src = 
                `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;
            document.getElementById('weatherTemp').textContent = 
                `${Math.round(data.main.temp)}°C`;
            document.getElementById('weatherDesc').textContent = 
                data.weather[0].description;
            document.getElementById('humidity').textContent = 
                `${data.main.humidity}%`;
            document.getElementById('wind').textContent = 
                `${(data.wind.speed * 3.6).toFixed(1)} km/h`;
            document.getElementById('pressure').textContent = 
                `${data.main.pressure} hPa`;
            document.getElementById('visibility').textContent = 
                `${(data.visibility / 1000).toFixed(1)} km`;
            
            // Check alerts
            checkAlerts(data);
        }
        
        function checkAlerts(data) {
            const alertEl = document.getElementById('weatherAlert');
            const alertText = document.getElementById('alertText');
            let message = '';
            
            if (data.weather[0].main === 'Rain' && data.rain?.['1h'] > 10) {
                message = 'Hujan deras! Pertimbangkan kegiatan indoor.';
            } else if (data.wind.speed > 10) {
                message = 'Angin kencang! Hati-hati di lapangan.';
            } else if (data.main.temp > 35) {
                message = 'Suhu sangat panas! Pastikan hidrasi cukup.';
            }
            
            if (message) {
                alertText.textContent = message;
                alertEl.classList.add('show');
            }
        }
        
        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000); // Refresh 30 menit
    </script>
</body>
</html>
